services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    container_name: producer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # In-network listener — Kafka advertises kafka:9092 to compose peers.
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=orders
      - PORT=8080
    depends_on:
      kafka:
        condition: service_healthy

  email-consumer:
    build:
      context: .
      dockerfile: docker/email-consumer.Dockerfile
    container_name: email-consumer
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=orders
      - KAFKA_GROUP_ID=email-consumer-group
    depends_on:
      kafka:
        condition: service_healthy

  inventory-consumer-1:
    build:
      context: .
      dockerfile: docker/inventory-consumer.Dockerfile
    container_name: inventory-consumer-1
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=orders
      - KAFKA_GROUP_ID=inventory-consumer-group
    command: ["--id=inventory-1"]
    depends_on:
      kafka:
        condition: service_healthy

  inventory-consumer-2:
    # Second instance for the consumer-scaling demo (Phase 4). Same image,
    # different --id, same group. Kafka distributes the 3 partitions between
    # these two. Bring this one up with `make up-scale` to demo scaling.
    build:
      context: .
      dockerfile: docker/inventory-consumer.Dockerfile
    container_name: inventory-consumer-2
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=orders
      - KAFKA_GROUP_ID=inventory-consumer-group
    command: ["--id=inventory-2"]
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["scale"] # only started with `--profile scale` or `make up-scale`

volumes:
  kafka_data:
